<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movement & the brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --surface:#1b1f26;
    --surface-2:#20252d;
    --border:rgba(255,255,255,0.08);
    --text-primary:#edeef0;
    --text-secondary:#9aa0ac;
    --text-muted:#666d78;

    --c-blood:#e05a4e;
    --c-alert:#f2a63c;
    --c-chem:#2bab9d;
    --c-endo:#9a7fe6;
    --c-stress:#4fa3d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 64px;
  }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(26px, 4vw, 34px);
    line-height:1.2;
    margin:0 0 12px;
  }
  .sub{
    color:var(--text-secondary);
    font-size:15px;
    line-height:1.6;
    max-width:52ch;
    margin:0 0 36px;
  }

  /* activity picker */
  .picker{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:28px;
  }
  .pick-btn{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    background:var(--surface);
    border:0.5px solid var(--border);
    border-radius:10px;
    padding:12px 6px;
    cursor:pointer;
    text-align:center;
    transition:border-color .15s, color .15s, background .15s;
  }
  .pick-btn:hover{ border-color:rgba(255,255,255,0.18); }
  .pick-btn.active{
    color:var(--bg);
    background:var(--text-primary);
    border-color:var(--text-primary);
  }

  /* duration slider */
  .duration-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:36px;
    font-size:13px;
    color:var(--text-secondary);
  }
  .duration-row label{ white-space:nowrap; }
  input[type=range]{
    -webkit-appearance:none;
    flex:1;
    height:3px;
    border-radius:2px;
    background:var(--border);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--text-primary);
    cursor:pointer;
    border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--text-primary);
    cursor:pointer;
    border:none;
  }
  #dur-val{
    min-width:46px;
    text-align:right;
    font-family:'Space Grotesk', sans-serif;
    color:var(--text-primary);
    font-weight:500;
  }

  /* pulse visualization */
  .pulse-card{
    background:var(--surface);
    border:0.5px solid var(--border);
    border-radius:14px;
    padding:20px 20px 4px;
    margin-bottom:32px;
  }
  .pulse-label{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  svg#pulse{ display:block; width:100%; height:110px; }
  #pulse-path{
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke .3s;
  }

  /* metrics */
  .metrics{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .metric-row{ }
  .metric-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .metric-name{
    font-size:14px;
    font-weight:500;
  }
  .metric-val{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    color:var(--text-secondary);
  }
  .bar-track{
    height:6px;
    border-radius:3px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:3px;
    width:0%;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  .caption{
    margin-top:32px;
    padding-top:20px;
    border-top:0.5px solid var(--border);
    font-size:14px;
    line-height:1.65;
    color:var(--text-secondary);
  }
  .caption strong{ color:var(--text-primary); font-weight:500; }

  @media (max-width:520px){
    .picker{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Physiology, visualized</p>
  <h1>How movement changes your brain chemistry</h1>
  <p class="sub">Pick an activity level and duration to see the physiological shifts behind why moving makes you feel more alert and steadier &mdash; not just anecdotally, but chemically.</p>

  <div class="picker" id="picker" role="tablist" aria-label="Activity level"></div>

  <div class="duration-row">
    <label for="duration">Duration</label>
    <input type="range" id="duration" min="5" max="60" step="5" value="20">
    <span id="dur-val">20 min</span>
  </div>

  <div class="pulse-card">
    <p class="pulse-label">Relative neural activity</p>
    <svg id="pulse" viewBox="0 0 700 110" preserveAspectRatio="none" role="img" aria-label="Animated line showing relative neural activity intensity for the selected activity">
      <path id="pulse-path" d=""></path>
    </svg>
  </div>

  <div class="metrics" id="metrics"></div>

  <p class="caption" id="caption"></p>
</div>

<script>
const activities = [
  {
    id: 'sedentary',
    label: 'Sedentary',
    speed: 5.5,
    amp: 6,
    metrics: { blood: 15, alert: 20, chem: 15, endo: 5, stress: 10 },
    text: 'Sitting still keeps blood flow and neurotransmitter turnover at baseline. Extended inactivity is linked to lower alertness and flatter mood over the course of a day.'
  },
  {
    id: 'light',
    label: 'Light walk',
    speed: 3.2,
    amp: 14,
    metrics: { blood: 45, alert: 50, chem: 45, endo: 30, stress: 45 },
    text: 'Even a light walk measurably increases cerebral blood flow and nudges up dopamine and serotonin activity &mdash; enough to shift alertness and mood within minutes.'
  },
  {
    id: 'moderate',
    label: 'Moderate exercise',
    speed: 2.1,
    amp: 26,
    metrics: { blood: 70, alert: 72, chem: 70, endo: 65, stress: 68 },
    text: 'Sustained moderate effort (brisk walking, cycling, swimming) drives a larger, more consistent rise in blood flow and mood-related brain chemicals, with effects that outlast the activity itself.'
  },
  {
    id: 'vigorous',
    label: 'Vigorous exercise',
    speed: 1.3,
    amp: 38,
    metrics: { blood: 92, alert: 85, chem: 90, endo: 95, stress: 80 },
    text: 'High-intensity effort produces the sharpest spike in blood flow and endorphin release &mdash; the physiological basis of a runner\'s high &mdash; though the added benefit over moderate exercise levels off for some measures.'
  }
];

const colors = {
  blood: 'var(--c-blood)',
  alert: 'var(--c-alert)',
  chem: 'var(--c-chem)',
  endo: 'var(--c-endo)',
  stress: 'var(--c-stress)'
};
const metricLabels = {
  blood: 'Blood flow',
  alert: 'Alertness',
  chem: 'Dopamine / serotonin',
  endo: 'Endorphins',
  stress: 'Stress reduction'
};

let current = activities[1];
let duration = 20;

const picker = document.getElementById('picker');
activities.forEach(a => {
  const btn = document.createElement('button');
  btn.className = 'pick-btn' + (a.id === current.id ? ' active' : '');
  btn.textContent = a.label;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', a.id === current.id ? 'true' : 'false');
  btn.dataset.id = a.id;
  btn.addEventListener('click', () => {
    current = a;
    [...picker.children].forEach(c => {
      c.classList.toggle('active', c.dataset.id === a.id);
      c.setAttribute('aria-selected', c.dataset.id === a.id ? 'true' : 'false');
    });
    render();
  });
  picker.appendChild(btn);
});

const metricsEl = document.getElementById('metrics');
Object.keys(metricLabels).forEach(key => {
  const row = document.createElement('div');
  row.className = 'metric-row';
  row.innerHTML = `
    <div class="metric-top">
      <span class="metric-name">${metricLabels[key]}</span>
      <span class="metric-val" id="val-${key}">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="fill-${key}" style="background:${colors[key]}"></div></div>
  `;
  metricsEl.appendChild(row);
});

const durationInput = document.getElementById('duration');
const durVal = document.getElementById('dur-val');
durationInput.addEventListener('input', () => {
  duration = Number(durationInput.value);
  durVal.textContent = duration + ' min';
  render();
});

function durationFactor() {
  // effects build with duration, up to ~30 min, then plateau
  return Math.min(1, 0.55 + (duration / 30) * 0.45);
}

function render() {
  const factor = durationFactor();
  Object.keys(metricLabels).forEach(key => {
    const raw = current.metrics[key];
    const adjusted = Math.round(raw * factor + raw * 0.15 * (1 - factor));
    document.getElementById(`fill-${key}`).style.width = Math.min(adjusted, 100) + '%';
    document.getElementById(`val-${key}`).textContent = Math.min(adjusted, 100) + '%';
  });
  document.getElementById('caption').innerHTML = `<strong>${current.label}, ${duration} min &mdash; </strong>${current.text}`;
}

// pulse animation
const path = document.getElementById('pulse-path');
let t = 0;
function pulseColor() {
  const map = { sedentary: 'var(--c-blood)', light: 'var(--c-stress)', moderate: 'var(--c-chem)', vigorous: 'var(--c-endo)' };
  return map[current.id];
}
function drawPulse() {
  const w = 700, h = 110, mid = h / 2;
  const amp = current.amp;
  const speed = current.speed;
  let d = `M 0 ${mid}`;
  const points = 140;
  for (let i = 0; i <= points; i++) {
    const x = (i / points) * w;
    const phase = (i / points) * Math.PI * 2 * speed + t;
    const y = mid - Math.sin(phase) * amp * (0.6 + 0.4 * Math.sin(phase / speed));
    d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  path.setAttribute('d', d);
  path.style.stroke = pulseColor();
}
function animate() {
  t += 0.035;
  drawPulse();
  requestAnimationFrame(animate);
}

const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
render();
if (prefersReduced) {
  drawPulse();
} else {
  animate();
}
</script>
</body>
</html>
